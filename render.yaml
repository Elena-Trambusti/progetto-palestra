# Un solo servizio Web: CRA build + API + static file da Express (niente react-scripts start in produzione).
services:
  - type: web
    name: palestra-app
    runtime: node
    rootDir: .
    plan: free
    autoDeploy: true
    # Un solo comando: niente && multilinea spezzato nel pannello Render (quello dava "npm help" e exit 1).
    buildCommand: bash scripts/render-build.sh
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: REQUIRE_AUTH
        value: "true"
      - key: AUTH_PASSWORD
        generateValue: true
      - key: INGEST_SECRET
        generateValue: true
      - key: AUTHORIZED_DEV_EUIS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        value: "https://backend-palestra.onrender.com"
      - key: TELEGRAM_AUTO_MONITOR
        value: "false"
      - key: DATA_DIR
        value: /var/data
    disks:
      - name: palestra-data
        mountPath: /var/data
        sizeGB: 1
